<style>
  :root {
    --bg: #fbfbfd; --card: #ffffff; --ink: #1d1d1f; --ink-2: #6e6e73;
    --line: rgba(0,0,0,0.10); --blue: #0b86ff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px; }
  header { padding: 26px 0; border-bottom: 1px solid var(--line); margin-bottom: 44px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header a.home { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  header nav { display: flex; gap: 18px; flex-wrap: wrap; }
  header nav a { font-size: 13.5px; color: var(--ink-2); text-decoration: none; }
  header nav a:hover { color: var(--blue); }
  header nav a.on { color: var(--blue); font-weight: 600; }
  h1 { font-size: clamp(30px, 4.4vw, 44px); letter-spacing: -0.025em; line-height: 1.1; margin-bottom: 22px; }
  h2 { font-size: 23px; letter-spacing: -0.015em; margin: 46px 0 14px; }
  h3 { font-size: 17px; letter-spacing: -0.01em; margin: 32px 0 10px; }
  h4 { font-size: 15px; margin: 24px 0 8px; }
  p { margin-bottom: 16px; color: #2c2c2e; }
  ul, ol { margin: 0 0 18px 22px; }
  li { margin-bottom: 7px; color: #2c2c2e; }
  a { color: var(--blue); }
  code { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, monospace; font-size: 0.88em; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 5px; }
  pre { background: #101014; color: #e8e8ed; padding: 18px 20px; border-radius: 14px; overflow-x: auto; margin-bottom: 20px; }
  pre code { background: none; padding: 0; color: inherit; font-size: 12.5px; line-height: 1.55; white-space: pre; }
  blockquote { border-left: 3px solid var(--blue); background: var(--card); padding: 14px 18px; border-radius: 0 12px 12px 0; margin-bottom: 18px; box-shadow: inset 0 0 0 0.5px var(--line); }
  blockquote p { margin: 0; color: var(--ink-2); }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 26px; font-size: 14px; }
  th, td { text-align: left; padding: 10px 12px; vertical-align: top; }
  thead th { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1px solid var(--line); }
  tbody tr + tr td { border-top: 0.5px solid var(--line); }
  hr { border: none; border-top: 1px solid var(--line); margin: 40px 0; }
  footer { border-top: 1px solid var(--line); margin-top: 60px; padding: 26px 0 60px; font-size: 12.5px; color: var(--ink-2); }
</style>
</head>

    </nav>

</div>
</body>
</html>
